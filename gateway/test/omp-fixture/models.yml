# Shape of omp's ~/.omp/agent/models.yml (values are made up; key commands are placeholders).
providers:
  acme:
    baseUrl: https://api.acme.test/v1
    apiKey: "!printf placeholder-not-a-key"
    api: openai-completions
    futureProviderKnob: true
    models:
      - id: fast-1
        name: Acme Fast 1
        reasoning: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 262144
        cost: {input: 0.01, output: 0.08, cacheRead: 0.002, cacheWrite: 0}
        thinking: { mode: effort, efforts: [low, high] }
        compat:
          reasoningEffortMap: {minimal: low, low: low, medium: high, high: high, xhigh: max, max: max}
          supportsDeveloperRole: false
          streamIdleTimeoutMs: 45000
      - id: slow-2
        name: Acme Slow 2
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 65536
      - id: claude-lookalike
        name: Not Claude
  other:
    baseUrl: https://api.other.test/v1
    apiKey: "!printf placeholder-not-a-key"
    api: openai-completions
    models:
      - id: o-1
        name: Other 1
  weird:
    baseUrl: https://api.weird.test/v1
    api: openai-codex-responses
    models:
      - id: w-1
